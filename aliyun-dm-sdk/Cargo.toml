[package]
name = "aliyun-dm-sdk"
version = "0.1.0"
edition = "2024"

[lib]
name = "aliyun_dm_sdk"
path = "src/lib.rs"

[[bin]]
name = "aliyun-dm-sdk"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
hmac = "0.13"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
url = "2"
wiremock = "0.6"
