name: Release

# Fires on semver tags like v0.1.0 / v1.2.3. Push a tag to cut a release:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---- cross-platform binaries -> GitHub Release ---------------------------
  binaries:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # create the release and upload assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-13
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Builds the gateway binary for `target` (using `cross` for the Linux
      # cross targets), archives it, generates a SHA-256 checksum, and uploads
      # everything to the Release matching the pushed tag (created if absent).
      - name: Build and upload
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: aliyun-directmail-smtp-gateway
          target: ${{ matrix.target }}
          archive: aliyun-directmail-smtp-gateway-$tag-$target
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}

  # ---- multi-arch container image -> GHCR ----------------------------------
  docker:
    name: docker image (ghcr.io)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GitHub Container Registry
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derives tags/labels from the git tag: full version, major.minor, and
      # `latest`. Image name is lowercased automatically from the repo slug.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
