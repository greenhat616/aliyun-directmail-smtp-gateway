[package]
name = "aliyun-directmail-smtp-gateway"
version = "0.1.0"
edition = "2024"

[dependencies]
aliyun-dm-sdk = { version = "0.1.0", path = "../aliyun-dm-sdk" }
async-trait = "0.1.89"
mail-parser = "0.11.4"
smtp-proto = "0.2.1"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
